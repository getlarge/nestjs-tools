name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan the release without committing, tagging, creating releases, or publishing.
        required: false
        type: boolean
        default: true
      first_release:
        description: Bootstrap projects that do not yet have a release tag.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  nx-release:
    name: Nx Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Guard production ref
        if: ${{ !inputs.dry_run && github.ref_name != 'main' }}
        run: |
          echo 'Non-dry-run releases must run from main.'
          exit 1

      - name: Run Nx Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_ACCESS: public
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail

          release_args=(--yes --skip-publish --verbose)
          publish_args=(--verbose)
          if [[ '${{ inputs.first_release }}' == 'true' ]]; then
            release_args+=(--first-release)
            publish_args+=(--first-release)
          fi

          if [[ '${{ inputs.dry_run }}' == 'true' ]]; then
            npx nx release --dry-run "${release_args[@]}"
            exit 0
          fi

          before_release="$(git rev-parse HEAD)"
          npx nx release "${release_args[@]}"
          after_release="$(git rev-parse HEAD)"

          if [[ "$after_release" == "$before_release" ]]; then
            echo 'No release commit was created.'
            exit 0
          fi

          git push origin HEAD:main --follow-tags --atomic
          npx nx release publish "${publish_args[@]}"
