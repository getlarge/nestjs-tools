name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan the release without committing, tagging, creating releases, or publishing.
        required: false
        type: boolean
        default: true
      first_release:
        description: Bootstrap projects that do not yet have a release tag.
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify-main-ci:
    name: Verify main CI
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Guard production ref
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo 'Non-dry-run releases must run from main.'
          exit 1

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          successful_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/node.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq '.total_count')"
          if [[ "$successful_runs" == '0' ]]; then
            echo "The main commit ${GITHUB_SHA} has no successful NestJS Tools CI run."
            exit 1
          fi

  dry-run:
    name: Preview Nx Release
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Preview Nx Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_args=(--skip-publish --verbose)
          if [[ '${{ inputs.first_release }}' == 'true' ]]; then
            release_args+=(--first-release)
          fi

          npx nx release --dry-run "${release_args[@]}"

  publish:
    name: Nx Release and publish
    if: ${{ !inputs.dry_run }}
    needs: verify-main-ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run Nx Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_ACCESS: public
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail

          release_args=(--skip-publish --verbose)
          publish_args=(--verbose)
          if [[ '${{ inputs.first_release }}' == 'true' ]]; then
            release_args+=(--first-release)
            publish_args+=(--first-release)
          fi

          before_release="$(git rev-parse HEAD)"
          npx nx release "${release_args[@]}"
          after_release="$(git rev-parse HEAD)"

          if [[ "$after_release" == "$before_release" ]]; then
            echo 'No release commit was created.'
            exit 0
          fi

          git push origin HEAD:main --follow-tags --atomic
          npx nx release publish "${publish_args[@]}"
